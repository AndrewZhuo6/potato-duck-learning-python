<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <a href="index.html">🦆 Quackbit</a>
    </div>
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="preparation1.html">Chapters</a></li>
        <li><a href="team.html">About Us</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h1>Sign Up to Our Learning Platform</h1>

      <div id="error-box" class="error-notice"></div>

      <form id="register-form" action="register.html" method="POST">
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirm-password">Re-enter Password:</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn">Create Account</button>
      </form>
    </section>
  </main>
  <script src="script/register.js"></script>
</body>
</html>
