<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <header class="header">
    <div class="logo">
    <a href="index.html"><img src="assets/images/logo.png" alt="Logo" class="logo-image"></a>
    </div>
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="team.html">About Us</a></li>
        <li><a href="story.html">Story</a></li> 
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h1>Log In to Our Learning Platform</h1>

      <div id="error-box" class="error-notice"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn">Log In</button>
      </form>

      <p>
        Don't have an account yet? <a href="register.html">Create one here</a>.
      </p>
    </section>
  </main>
  <script src="script/login.js"></script>
</body>
</html>
